<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTV Lebanon">
<title>MTV Lebanon Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<!-- HLS.js for native video playback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#c0392b;--red2:#e74c3c;
  --bg:#0e0e0f;--s1:#1a1a1d;--s2:#222226;
  --bd:#2e2e33;--txt:#e8e6e3;--muted:#888682;--faint:#444;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:34px;height:34px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.logo-title{font-size:15px;font-weight:600}
.logo-sub{font-size:11px;color:var(--muted)}
.hdr-right{display:flex;align-items:center;gap:8px}
.live-pill{display:flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.35);border-radius:999px;font-size:11px;font-weight:700;color:#e74c3c;text-transform:uppercase;letter-spacing:.08em}
.dot{width:6px;height:6px;border-radius:50%;background:#e74c3c;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--bd);border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all 140ms ease;white-space:nowrap}
.btn:hover{background:var(--s2);color:var(--txt)}
.btn:active{transform:scale(.96)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-red:hover{background:var(--red2);border-color:var(--red2);color:#fff}
.btn-red:disabled{opacity:0.5;cursor:not-allowed}

/* PLAYER */
.player-wrap{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}

/* Native video element - this is what enables REAL PiP */
#main-video{
  width:100%;height:100%;object-fit:contain;
  background:#000;display:block;
}

/* Fallback iframe (shown when no direct stream) */
#fallback-frame{
  width:100%;height:100%;border:none;display:none;
}

/* Loading overlay */
.loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.7);gap:16px;
  pointer-events:none;
}
.loading.hidden{display:none}
.spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);
  border-top-color:#e74c3c;border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:13px;color:var(--muted)}

/* Stream error msg */
.stream-error{
  position:absolute;inset:0;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:24px;
}
.stream-error.show{display:flex}
.stream-error h3{font-size:16px;color:var(--txt)}
.stream-error p{font-size:13px;color:var(--muted);max-width:320px;line-height:1.6}

/* BOTTOM BAR */
.bot{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--s1);border-top:1px solid var(--bd);flex-shrink:0;gap:8px;flex-wrap:wrap}
.bot-l,.bot-r{display:flex;gap:8px;align-items:center}
.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* REMINDER PANEL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.panel{width:100%;max-width:500px;background:var(--s1);border-radius:16px 16px 0 0;padding:20px;border:1px solid var(--bd);border-bottom:none;animation:up .25s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pt{font-size:15px;font-weight:600}
.px{width:28px;height:28px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.px:hover{color:var(--txt)}
.row{display:flex;gap:8px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px;flex:1}
.fg label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.fg input{padding:8px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:var(--txt);font-size:13px;font-family:'Inter',sans-serif}
.fg input:focus{outline:none;border-color:var(--red)}
.rlist{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:180px;overflow-y:auto}
.ri{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--s2);border-radius:8px}
.rt{font-size:12px;color:#f39c12;font-weight:600;min-width:48px;font-variant-numeric:tabular-nums}
.rn{font-size:13px;flex:1}
.rd{background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px}
.rd:hover{color:var(--red2)}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:16px 0}

/* TOAST */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--txt);box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:9999;opacity:0;transition:all .3s cubic-bezier(.16,1,.3,1);white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* PiP indicator badge */
.pip-badge{
  display:none;
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.8);border:1px solid var(--bd);
  border-radius:999px;padding:4px 14px;
  font-size:12px;color:var(--muted);gap:6px;align-items:center;
}
.pip-badge.show{display:flex}

@media(max-width:500px){
  .logo-sub,.clock{display:none}
  .bot{padding:6px 10px}
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-box">MTV</div>
      <div><div class="logo-title">MTV Lebanon</div><div class="logo-sub">Live Stream</div></div>
    </div>
    <div class="hdr-right">
      <div class="live-pill"><span class="dot"></span>Live</div>
      <button class="btn" onclick="reloadStream()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Reload
      </button>
    </div>
  </header>

  <!-- PLAYER -->
  <div class="player-wrap" id="pw">

    <!-- REAL native video for true PiP -->
    <video id="main-video" controls playsinline
      poster=""
      crossorigin="anonymous">
    </video>

    <!-- Fallback iframe if HLS fails -->
    <iframe id="fallback-frame"
      src=""
      allow="autoplay;fullscreen;picture-in-picture"
      allowfullscreen>
    </iframe>

    <!-- Loading spinner -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span class="load-text">Connecting to stream…</span>
    </div>

    <!-- Error state -->
    <div class="stream-error" id="stream-error">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h3>Stream unavailable</h3>
      <p>The direct stream could not be loaded. Switching to web player…</p>
      <button class="btn btn-red" onclick="loadFallback()">Open Web Player</button>
    </div>

    <!-- PiP active indicator -->
    <div class="pip-badge" id="pip-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="10" y="11" width="12" height="9" rx="1"/></svg>
      Playing in Picture-in-Picture
    </div>

  </div>

  <!-- BOTTOM BAR -->
  <div class="bot">
    <div class="bot-l">
      <button class="btn btn-red" id="pip-btn" onclick="triggerPiP()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="10" y="11" width="12" height="9" rx="1"/></svg>
        PiP
      </button>
      <button class="btn" onclick="fullscr()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        Fullscreen
      </button>
      <button class="btn" onclick="openTab()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Tab
      </button>
    </div>
    <div class="bot-r">
      <span class="clock" id="clk"></span>
      <button class="btn" onclick="togglePanel()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Reminders
      </button>
      <button class="btn" onclick="exportICS()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        .ics
      </button>
    </div>
  </div>
</div>

<!-- Reminder Panel -->
<div class="overlay" id="ov" onclick="outsideClose(event)">
  <div class="panel">
    <div class="ph"><span class="pt">🔔 Reminders</span><button class="px" onclick="togglePanel()">×</button></div>
    <div class="row">
      <div class="fg" style="flex:2"><label>Show Name</label><input id="rn" type="text" value="It's About Time" placeholder="Show name"></div>
      <div class="fg" style="flex:1"><label>Time</label><input id="rt" type="time"></div>
    </div>
    <button class="btn btn-red" style="width:100%;justify-content:center;padding:9px" onclick="addR()">+ Add Reminder</button>
    <ul class="rlist" id="rl"></ul>
    <p class="empty" id="re">No reminders yet.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STREAM SOURCES (try in order) ──
// Multiple known MTV Lebanon stream URLs to try
const STREAMS = [
  'https://mtv-lb.akamaized.net/hls/live/2100517/mtvlebanon/index.m3u8',
  'https://cdn-mtvlb.akamaized.net/out/v1/mtvlebanon/index.m3u8',
  'https://streaming.mtv.com.lb/live/smil:mtvlive.smil/playlist.m3u8',
  'https://5b6c8f35a8252.streamlock.net/mtvlive/smil:mtvlive.smil/playlist.m3u8',
];
let streamIdx = 0;
let hls = null;
const video = document.getElementById('main-video');

const showLoading = (v) => {
  document.getElementById('loading').classList.toggle('hidden', !v);
};
const showError = (v) => {
  document.getElementById('stream-error').classList.toggle('show', v);
  showLoading(false);
};

const tryNextStream = () => {
  if (streamIdx >= STREAMS.length) {
    showError(true);
    return;
  }
  loadHLS(STREAMS[streamIdx++]);
};

const loadHLS = (url) => {
  showLoading(true);
  showError(false);
  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, backBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      showLoading(false);
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) tryNextStream();
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      showLoading(false);
      video.play().catch(() => {});
    }, {once:true});
    video.addEventListener('error', () => tryNextStream(), {once:true});
  } else {
    showError(true);
  }
};

// Fallback: open iframe with elahmad
const loadFallback = () => {
  showError(false);
  video.style.display = 'none';
  const frame = document.getElementById('fallback-frame');
  frame.src = 'https://www.elahmad.org/tv/mtvlebanon.htm';
  frame.style.display = 'block';
  document.getElementById('pip-btn').disabled = true;
  document.getElementById('pip-btn').title = 'PiP not available in fallback mode';
  toast('Switched to web player. PiP not available in this mode.');
};

// Start stream on load
window.addEventListener('load', () => tryNextStream());

// ── REAL PiP using browser API on the <video> element ──
const triggerPiP = async () => {
  if (video.style.display === 'none') {
    toast('PiP not available in fallback mode');
    return;
  }
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else if (document.pictureInPictureEnabled) {
      await video.requestPictureInPicture();
      toast('📺 PiP active! Video floats while you browse.');
    } else {
      toast('PiP not supported on this browser/device');
    }
  } catch(e) {
    // iOS Safari workaround — trigger via user gesture on video
    video.play().then(() => {
      video.requestPictureInPicture && video.requestPictureInPicture();
    });
  }
};

// PiP events
video.addEventListener('enterpictureinpicture', () => {
  document.getElementById('pip-badge').classList.add('show');
  document.getElementById('pip-btn').textContent = '✕ Exit PiP';
  toast('📺 Playing in PiP — browse freely!');
});
video.addEventListener('leavepictureinpicture', () => {
  document.getElementById('pip-badge').classList.remove('show');
  document.getElementById('pip-btn').innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="10" y="11" width="12" height="9" rx="1"/></svg> PiP`;
});

// ── FULLSCREEN on native video ──
const fullscr = () => {
  if (video.requestFullscreen) video.requestFullscreen();
  else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS
  toast('Fullscreen ↗');
};

const reloadStream = () => {
  streamIdx = 0;
  tryNextStream();
  toast('Reconnecting…');
};
const openTab = () => {
  window.open('https://www.elahmad.org/tv/mtvlebanon.htm','_blank','noopener');
};

// ── CLOCK ──
const clk = document.getElementById('clk');
setInterval(() => {
  const n = new Date();
  clk.textContent = n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' CEST';
}, 1000);

// ── TOAST ──
let tt;
const toast = (m) => {
  const e = document.getElementById('toast');
  e.textContent = m;
  e.classList.add('on');
  clearTimeout(tt);
  tt = setTimeout(() => e.classList.remove('on'), 3000);
};

// ── REMINDERS ──
let rems = [];
const renderR = () => {
  const l = document.getElementById('rl'), em = document.getElementById('re');
  l.innerHTML = '';
  if (!rems.length) { em.style.display='block'; return; }
  em.style.display = 'none';
  [...rems].sort((a,b)=>a.t.localeCompare(b.t)).forEach((r,i) => {
    const li = document.createElement('li'); li.className='ri';
    li.innerHTML=`<span class="rt">${r.t}</span><span class="rn">${r.n.replace(/</g,'&lt;')}</span><button class="rd" onclick="delR(${i})">×</button>`;
    l.appendChild(li);
  });
};
const addR = () => {
  const n=document.getElementById('rn').value.trim(), t=document.getElementById('rt').value;
  if(!n||!t){toast('Enter name and time!');return;}
  rems.push({n,t,fired:false}); renderR();
  toast(`Reminder: "${n}" at ${t} 🔔`);
};
const delR = i => { rems.splice(i,1); renderR(); };
setInterval(() => {
  const n=new Date(), hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  rems.forEach(r => {
    if(r.t===hm&&!r.fired){r.fired=true;toast(`🔔 "${r.n}" is ON!`);reloadStream();setTimeout(()=>r.fired=false,120000);}
  });
}, 15000);
const togglePanel = () => document.getElementById('ov').classList.toggle('on');
const outsideClose = e => { if(e.target===document.getElementById('ov'))togglePanel(); };

// ICS Export
const exportICS = () => {
  if(!rems.length){toast('Add a reminder first!');return;}
  const d=new Date(),yy=d.getFullYear(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MTV Lebanon//EN'];
  rems.forEach(r=>{
    const[hh,min]=r.t.split(':');
    lines.push('BEGIN:VEVENT',`UID:mtv-${Date.now()}`,`DTSTART:${yy}${mm}${dd}T${hh}${min}00`,
      `DTEND:${yy}${mm}${dd}T${hh}${String(parseInt(min)+60).padStart(2,'0')}00`,
      `SUMMARY:📺 ${r.n} — MTV Lebanon`,
      'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY',`DESCRIPTION:5 min until ${r.n}!`,'END:VALARM','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'}));
  a.download='mtv-reminder.ics'; a.click();
  toast('Calendar downloaded! 📅');
};

// Keyboard
document.addEventListener('keydown', e => {
  if(e.key==='f'||e.key==='F') fullscr();
  if(e.key==='p'||e.key==='P') triggerPiP();
  if(e.key==='r'||e.key==='R') reloadStream();
});
renderR();
</script>
</body>
</html>
