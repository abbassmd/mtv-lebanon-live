<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTV Lebanon Live</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 100%; max-width: 800px; height: auto; }
    </style>
</head>
<body>

    <video 
        id="video" 
        controls 
        playsinline 
        webkit-playsinline 
        autoplay>
        <source src="https://YOUR_WORKER_URL.workers.dev/" type="application/x-mpegURL">
        Your browser does not support HLS playback.
    </video>

    <script>
        const video = document.getElementById('video');
        // Safari handles .m3u8 natively, so no extra JS libraries are needed.
        video.addEventListener('loadedmetadata', () => {
            video.play().catch(e => console.log("Autoplay blocked, waiting for user interaction."));
        });
    </script>
</body>
</html>
