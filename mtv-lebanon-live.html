<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MTV Lebanon Live</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .frame-wrap {
      position: fixed;
      inset: 0;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .topbar {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,.65), rgba(0,0,0,0));
      pointer-events: none;
    }

    .btn {
      pointer-events: auto;
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(20,20,20,.8);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .msg {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0));
      z-index: 10;
      color: #fff;
      background: rgba(0,0,0,.65);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn" onclick="reloadFrame()">Reload</button>
    <button class="btn" onclick="openOriginal()">Open Original</button>
  </div>

  <div class="frame-wrap">
    <iframe
      id="playerFrame"
      src="https://www.elahmad.org/tv/mtvlebanon.htm"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <div class="msg">
    If playback does not start, tap inside the player. On iPhone, PiP must be triggered from the embedded page itself.
  </div>

  <script>
    function reloadFrame() {
      const f = document.getElementById('playerFrame');
      f.src = f.src;
    }

    function openOriginal() {
      window.location.href = 'https://www.elahmad.org/tv/mtvlebanon.htm';
    }
  </script>
</body>
</html>
